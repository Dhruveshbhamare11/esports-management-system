server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:esports_nexus_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

app:
  cors:
    allowed-origins: http://localhost:3000
  seeder:
    enabled: false
